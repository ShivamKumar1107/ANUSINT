[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anusint"
version = "0.2.0"
description = "Advanced Anti-impersonation OSINT tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "click>=8.1.3",
    "rich>=13.0.0"
]

[project.scripts]
anusint = "core.cli:cli"