[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anusint"
version = "1.0.0"
description = "ANUSINT (Automated Network Username & Social Intelligence Notification Tool) - a public-data-only OSINT toolkit for spotting social media impersonation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/anusint"
Issues = "https://github.com/YOUR-USERNAME/anusint/issues"

[project.scripts]
anusint = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "config",
    "net",
    "export",
    "username_checker",
    "profile_snapshot",
    "impersonation_check",
]
